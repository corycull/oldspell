name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04  # image ships with the Android SDK
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK packages
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      # Your private upload key, stored as repository secrets (Settings → Secrets and variables → Actions).
      - name: Load signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No signing key secrets yet (see README). Building a test-signed copy and skipping the release."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Oldspell.apk
          cp app/build/outputs/bundle/release/app-release.aab out/Oldspell.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Oldspell
          path: out/*

      # Oldspell.apk installs directly on your phone; Oldspell.aab is what you upload to Google Play.
      - uses: softprops/action-gh-release@v2
        if: steps.key.outputs.present == 'true'
        with:
          tag_name: build-${{ github.run_number }}
          name: Oldspell build ${{ github.run_number }}
          files: |
            out/Oldspell.apk
            out/Oldspell.aab
          make_latest: true
