name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease assembleDebug
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Earmark.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/Earmark-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Earmark-apk
          path: out/*.apk

      # Publishes the APK on the repo's Releases page so you can download it straight to your phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Earmark build ${{ github.run_number }}
          files: out/Earmark.apk
          make_latest: true
